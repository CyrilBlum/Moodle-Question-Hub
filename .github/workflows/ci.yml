name: Subplugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: PHP ${{ matrix.php-version }} Syntax & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, curl, zip, intl

    - name: Syntax Check (php -l)
      run: |
        find . -name "*.php" -not -path "./vendor/*" -exec php -l {} +

    - name: Swiss German Spelling Compliance (Zero "ß")
      run: |
        if grep -rn "ß" lang/de/; then
          echo "ERROR: German 'ß' character detected in lang/de/! Swiss Standard German requires 'ss'."
          exit 1
        fi
        echo "PASS: Zero 'ß' found in lang/de/."

  moodle-plugin-ci:
    # Moodle's standard plugin checks: code style incl. security sniffs, PHPDoc, PHPMD, Mustache, upgrade savepoints,
    # install and PHPUnit against a real Moodle.
    name: moodle-plugin-ci (${{ matrix.moodle-branch }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap, intl, mbstring, curl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      # Gate since 2026-10-27: no errors and no warnings allowed.
      - name: Moodle code checker (phpcs, incl. security sniffs)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHP mess detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Validate plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      # Remaining: missing example contexts and HTML validation of partial templates; reported, not yet a gate.
      - name: Mustache lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci mustache

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

  semgrep:
    name: Semgrep (PHP security rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: semgrep scan --config p/php --config p/secrets --config p/xss --error --metrics=off --exclude build
